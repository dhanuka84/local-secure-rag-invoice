
version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]


  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: cerbos
    ports:
      - "3592:3592"
      - "3593:3593"
    volumes:
      - ./policies:/policies:ro
      - ./cerbos-config:/config:ro
    command:
      - server
      - --config=/config/cerbos.yaml
    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


volumes:
  ollama:
